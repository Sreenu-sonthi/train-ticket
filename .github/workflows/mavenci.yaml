
name: CI pipeline to build Java code

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v5

      # 2. Setup JDK
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Validate with Maven
      - name: Validate with Maven
        run: mvn validate

      # 4. Compile with Maven
      - name: Compile with Maven
        run: mvn compile

      # 5. Test with Maven
      - name: Test with Maven
        run: mvn test

      # 6. Package with Maven
      - name: Package with Maven
        run: mvn package

      # 7. Verify WAR file
      - name: Verify WAR file
        run: ls -lh target/

      # 8. Deploy WAR to Tomcat
      - name: Deploy WAR to Tomcat
        run: |
          curl -v -u "${{ secrets.TOMCAT_USER }}:${{ secrets.TOMCAT_PASSWORD }}" \
          -T target/Trainbook-1.0.0-SNAPSHOT.war \
          "http://${{ secrets.TOMCAT_HOST }}:8080/manager/text/deploy?path=/TrainBook&update=true"
